[tasks.install]
description = "Install workspace dependencies and the Botlake CLIs"
run = '''
bun install --frozen-lockfile
mkdir -p dist/private
(cd extensions/ct-config && bun pm pack --destination ../../dist/private --ignore-scripts)
bun install --cwd .botlake --frozen-lockfile
GOBIN="$HOME/.local/bin" go -C cli install ./cmd/botlake ./cmd/bl
'''

[tasks.setup]
alias = "default"
description = "Install Botlake and start this checkout's lake (requires a running supervisor)"
depends = ["install"]
run = '''
export PATH="$HOME/.local/bin:$PATH"
botlake lake start --workspace "{{ config_root }}"
'''
