[tasks.install]
description = "Restore agent skills, install workspace dependencies and the Botlake CLIs"
run = '''
bun install --frozen-lockfile
bun run -- skillbox sync
bun install --cwd .botlake --frozen-lockfile
GOBIN="$HOME/.local/bin" go -C cli install ./cmd/botlake ./cmd/bl
'''

[tasks.setup]
alias = "default"
description = "Install Botlake and start this checkout's lake (requires a running supervisor)"
depends = ["install"]
run = '''
export PATH="$HOME/.local/bin:$PATH"
botlake lake start --workspace "{{ config_root }}"
'''
